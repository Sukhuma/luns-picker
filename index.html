<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUNS Picker</title>
<meta name="apple-mobile-web-app-title" content="LUNS">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f1ea">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f1ea;
    color: #222;
    margin: 0;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }
  main { width: 100%; max-width: 560px; }
  h1 { margin: 0 0 1.5rem; }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .weather { display: flex; align-items: center; gap: 1rem; }
  .weather .icon { font-size: 2.5rem; }
  .verdict { font-weight: 600; }
  .modes { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
  .modes button { flex: 1; }
  button {
    font: inherit;
    border: 1px solid #ccc;
    background: #fafafa;
    border-radius: 8px;
    padding: 0.5rem 0.75rem;
    cursor: pointer;
  }
  button.active { background: #00a0e2; border-color: #00a0e2; color: #fff; }
  #spin {
    width: 100%;
    font-size: 1.25rem;
    padding: 1rem;
    background: #00a0e2;
    border: none;
    color: #fff;
    font-weight: 600;
  }
  #spin:disabled { opacity: 0.6; cursor: default; }
  #result {
    text-align: center;
    font-size: 1.75rem;
    font-weight: 700;
    min-height: 2.5rem;
    margin: 1rem 0 0;
  }
  .stage {
    position: relative;
    height: 360px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .wheel-wrap {
    position: relative;
    width: 320px;
    height: 320px;
  }
  #wheel {
    width: 100%;
    height: 100%;
    cursor: pointer;
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.2));
  }
  #wheel text {
    fill: #fff;
    font-weight: 800;
    paint-order: stroke;
    stroke: rgba(0, 0, 0, 0.25);
    stroke-width: 3px;
    pointer-events: none;
  }
  #wheel .segment { transition: filter 0.3s; }
  #wheel .segment.winner { filter: brightness(1.25) drop-shadow(0 0 8px #ffd166); }
  #wheel .segment.dim { filter: saturate(0.4) brightness(0.85); }
  .pointer {
    position: absolute;
    top: -6px;
    left: 50%;
    width: 0;
    height: 0;
    margin-left: -16px;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 34px solid #222;
    filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.3));
    transform-origin: 50% 0;
    z-index: 1;
  }
  .pointer.tick { animation: tick 0.12s ease-out; }
  @keyframes tick {
    0% { transform: rotate(0deg); }
    40% { transform: rotate(-22deg); }
    100% { transform: rotate(0deg); }
  }
  #confetti {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 10;
  }
  #luns {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 11;
    pointer-events: none;
    font-size: clamp(5rem, 22vw, 16rem);
    font-weight: 900;
    letter-spacing: 0.05em;
    line-height: 1;
    color: #ffd166;
    -webkit-text-stroke: 4px #222;
    text-shadow: 8px 8px 0 #ef476f, 16px 16px 0 #00a0e2;
    opacity: 0;
    transition: opacity 0.6s, color 0.3s;
    will-change: transform;
  }
  #luns.show { opacity: 1; }
  #result.pop { animation: pop 0.4s ease-out; }
  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    70% { transform: scale(1.12); }
    100% { transform: scale(1); opacity: 1; }
  }
  .lists { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  textarea {
    width: 100%;
    min-height: 140px;
    font: inherit;
    font-size: 0.9rem;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 0.5rem;
    resize: vertical;
  }
  label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 0.25rem; }
  .hint { font-size: 0.8rem; color: #888; margin-top: 0.5rem; }
  @media (max-width: 480px) { .lists { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="luns">LUNS</div>
<main>
  <h1>🍽️ LUNS Picker</h1>

  <div class="card">
    <div class="weather">
      <div class="icon" id="wIcon">⏳</div>
      <div>
        <div id="wText">Checking the weather for lunchtime…</div>
        <div class="verdict" id="wVerdict"></div>
      </div>
    </div>
    <div class="modes">
      <button data-mode="auto" class="active">Auto (weather)</button>
      <button data-mode="outside">☀️ Outside</button>
      <button data-mode="inside">🌧️ Inside</button>
    </div>
  </div>

  <div class="card">
    <div class="stage" id="stage">
      <div class="wheel-wrap">
        <div class="pointer" id="pointer"></div>
        <svg id="wheel" viewBox="-160 -160 320 320"></svg>
      </div>
    </div>
    <button id="spin">🎡 Spin the wheel!</button>
    <div id="result"></div>
  </div>

  <div class="card">
    <div class="lists">
      <div>
        <label for="outsideList">☀️ Nice weather spots</label>
        <textarea id="outsideList"></textarea>
      </div>
      <div>
        <label for="insideList">🌧️ Bad weather spots</label>
        <textarea id="insideList"></textarea>
      </div>
    </div>
    <div class="hint">One place per line. Saved automatically in this browser.</div>
  </div>
</main>

<script>
const ZAANDAM = { lat: 52.4389, lon: 4.8261 };
const LUNCH_HOUR = 12;
const NICE = { maxPrecipProb: 40, maxPrecip: 0.2, maxWind: 30 };

const DEFAULTS = {
  outside: ["Toko Kalimantan", "Toko Gembira", "Günay Lunchroom", "Kiss Bakery", "BackWERK"],
  inside: ["Canteen"],
};

const $ = (id) => document.getElementById(id);
const lists = { outside: $("outsideList"), inside: $("insideList") };
let mode = "auto";
let weatherVerdict = null;

for (const key of Object.keys(lists)) {
  const saved = localStorage.getItem(`lunch-${key}`);
  lists[key].value = saved ?? DEFAULTS[key].join("\n");
  lists[key].addEventListener("input", () => localStorage.setItem(`lunch-${key}`, lists[key].value));
}

document.querySelectorAll("[data-mode]").forEach((btn) => {
  btn.addEventListener("click", () => {
    mode = btn.dataset.mode;
    document.querySelectorAll("[data-mode]").forEach((b) => b.classList.toggle("active", b === btn));
  });
});

function weatherIcon(code) {
  if (code === 0) return "☀️";
  if (code <= 2) return "🌤️";
  if (code === 3) return "☁️";
  if (code <= 48) return "🌫️";
  if (code <= 67 || (code >= 80 && code <= 82)) return "🌧️";
  if (code <= 77 || code === 85 || code === 86) return "🌨️";
  return "⛈️";
}

async function loadWeather() {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${ZAANDAM.lat}&longitude=${ZAANDAM.lon}` +
    `&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m` +
    `&timezone=Europe%2FAmsterdam&forecast_days=1`;
  try {
    const res = await fetch(url);
    const { hourly } = await res.json();
    const i = hourly.time.findIndex((t) => new Date(t).getHours() === LUNCH_HOUR);
    const w = {
      temp: hourly.temperature_2m[i],
      precipProb: hourly.precipitation_probability[i],
      precip: hourly.precipitation[i],
      code: hourly.weather_code[i],
      wind: hourly.wind_speed_10m[i],
    };
    const reasons = [];
    if (w.precipProb > NICE.maxPrecipProb || w.precip > NICE.maxPrecip) reasons.push("rain likely");
    if (w.wind > NICE.maxWind) reasons.push("too windy");
    const sunny = w.code <= 1;
    weatherVerdict = sunny || reasons.length === 0 ? "outside" : "inside";

    $("wIcon").textContent = weatherIcon(w.code);
    $("wText").textContent = `At ${LUNCH_HOUR}:00: ${Math.round(w.temp)}°C, ${w.precipProb}% rain chance, wind ${Math.round(w.wind)} km/h`;
    $("wVerdict").textContent = weatherVerdict === "outside"
      ? (sunny ? "Sunny — let's go outside!" : "Nice weather — let's go outside!")
      : `Stay in — ${reasons.join(", ")}.`;
  } catch {
    $("wIcon").textContent = "❓";
    $("wText").textContent = "Couldn't fetch the weather.";
    $("wVerdict").textContent = "Pick Outside or Inside manually.";
  }
}

function currentOptions() {
  const pick = mode === "auto" ? (weatherVerdict ?? "inside") : mode;
  return lists[pick].value.split("\n").map((s) => s.trim()).filter(Boolean);
}

const SPIN_MS = 4500;
const RADIUS = 150;
const SEGMENT_COLORS = ["#00a0e2", "#ef476f", "#06d6a0", "#ffb703", "#8e7dbe", "#f78c6b", "#118ab2", "#e76f51"];
const SVG_NS = "http://www.w3.org/2000/svg";
let wheelOptions = [];
let rotation = 0;
let spinning = false;

const randInt = (n) => Math.floor(Math.random() * n);

function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function pointOnCircle(deg, r) {
  const rad = ((deg - 90) * Math.PI) / 180;
  return [r * Math.cos(rad), r * Math.sin(rad)];
}

function drawWheel() {
  if (spinning) return;
  const options = currentOptions();
  wheelOptions = options.length ? options : ["Add some places"];
  const wheel = $("wheel");
  wheel.replaceChildren();
  const rotor = svgEl("g", { id: "rotor", transform: `rotate(${rotation})` });
  const seg = 360 / wheelOptions.length;
  const fontSize = Math.max(11, Math.min(18, 120 / wheelOptions.length + 6));
  const labels = [];

  wheelOptions.forEach((name, i) => {
    const color = SEGMENT_COLORS[i % SEGMENT_COLORS.length];
    const shape = wheelOptions.length === 1
      ? svgEl("circle", { r: RADIUS })
      : (() => {
          const [x1, y1] = pointOnCircle(i * seg, RADIUS);
          const [x2, y2] = pointOnCircle((i + 1) * seg, RADIUS);
          return svgEl("path", { d: `M0 0 L${x1} ${y1} A${RADIUS} ${RADIUS} 0 ${seg > 180 ? 1 : 0} 1 ${x2} ${y2} Z` });
        })();
    shape.setAttribute("fill", color);
    shape.setAttribute("stroke", "#fff");
    shape.setAttribute("stroke-width", "3");
    shape.classList.add("segment");
    rotor.appendChild(shape);

    const mid = i * seg + seg / 2;
    const label = svgEl("text", {
      x: RADIUS - 16,
      y: 0,
      "text-anchor": "end",
      "dominant-baseline": "middle",
      "font-size": fontSize,
      transform: `rotate(${mid - 90})`,
    });
    label.textContent = name;
    rotor.appendChild(label);
    labels.push(label);
  });

  wheel.appendChild(rotor);
  const maxLabelLength = RADIUS - 16 - 36;
  for (const label of labels) {
    const length = label.getComputedTextLength();
    if (length > maxLabelLength) label.setAttribute("font-size", (fontSize * maxLabelLength) / length);
  }
  wheel.appendChild(svgEl("circle", { r: RADIUS, fill: "none", stroke: "#222", "stroke-width": 6 }));
  wheel.appendChild(svgEl("circle", { r: 26, fill: "#fff", stroke: "#222", "stroke-width": 4 }));
  const hub = svgEl("text", { "text-anchor": "middle", "dominant-baseline": "central", "font-size": 22 });
  hub.textContent = "🍽️";
  wheel.appendChild(hub);
}

function tickPointer() {
  const pointer = $("pointer");
  pointer.classList.remove("tick");
  void pointer.offsetWidth;
  pointer.classList.add("tick");
}

const easeOutQuart = (t) => 1 - Math.pow(1 - t, 4);

function spin() {
  if (spinning) return;
  const result = $("result");
  if (currentOptions().length === 0) {
    result.textContent = "Add some places first!";
    return;
  }
  drawWheel();
  spinning = true;
  $("spin").disabled = true;
  result.textContent = "";
  result.classList.remove("pop");

  const seg = 360 / wheelOptions.length;
  const winner = randInt(wheelOptions.length);
  const jitter = (Math.random() - 0.5) * seg * 0.7;
  const target = (((360 - (winner + 0.5) * seg + jitter) % 360) + 360) % 360;
  const start = rotation;
  const end = start + 360 * (5 + randInt(3)) + ((target - (start % 360)) + 360) % 360;
  const rotor = $("rotor");
  const t0 = performance.now();
  let lastSegment = Math.floor((((-start % 360) + 360) % 360) / seg);

  function frame(now) {
    const t = Math.min(1, (now - t0) / SPIN_MS);
    rotation = start + (end - start) * easeOutQuart(t);
    rotor.setAttribute("transform", `rotate(${rotation})`);
    const segment = Math.floor((((-rotation % 360) + 360) % 360) / seg);
    if (segment !== lastSegment) {
      lastSegment = segment;
      tickPointer();
    }
    if (t < 1) return requestAnimationFrame(frame);

    rotation = end % 360;
    rotor.setAttribute("transform", `rotate(${rotation})`);
    rotor.querySelectorAll(".segment").forEach((el, i) => {
      el.classList.toggle("winner", i === winner);
      el.classList.toggle("dim", i !== winner);
    });
    result.textContent = `🎉 ${wheelOptions[winner]}`;
    void result.offsetWidth;
    result.classList.add("pop");
    burstConfetti();
    $("spin").disabled = false;
    spinning = false;
  }
  requestAnimationFrame(frame);
}

const CONFETTI_COLORS = ["#ffd166", "#ef476f", "#06d6a0", "#38c6ff", "#ffffff", "#f78c6b", "#8e7dbe", "#ff006e"];
const CONFETTI_EMOJI = ["🎉", "🥳", "🥪", "🍜", "🥐", "🌯", "🍽️", "✨"];
const GRAVITY = 0.25;
const particles = [];
let confettiRunning = false;

function addParticle(x, y, angle, speed) {
  const emoji = Math.random() < 0.08;
  particles.push({
    x, y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    rot: Math.random() * Math.PI * 2,
    vrot: (Math.random() - 0.5) * 0.4,
    wobble: Math.random() * Math.PI * 2,
    w: 6 + Math.random() * 8,
    h: 10 + Math.random() * 10,
    color: CONFETTI_COLORS[randInt(CONFETTI_COLORS.length)],
    emoji: emoji ? CONFETTI_EMOJI[randInt(CONFETTI_EMOJI.length)] : null,
    size: 22 + Math.random() * 20,
  });
}

function cannon(x, y, baseAngle, count) {
  for (let i = 0; i < count; i++) {
    addParticle(x, y, baseAngle + (Math.random() - 0.5) * 0.9, 12 + Math.random() * 16);
  }
}

function rain(count) {
  for (let i = 0; i < count; i++) {
    addParticle(Math.random() * innerWidth, -20 - Math.random() * innerHeight * 0.5, Math.PI / 2, Math.random() * 3);
  }
}

function burst(x, y, count) {
  for (let i = 0; i < count; i++) addParticle(x, y, Math.random() * Math.PI * 2, 4 + Math.random() * 18);
}

function animateConfetti() {
  const canvas = $("confetti");
  const ctx = canvas.getContext("2d");
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += GRAVITY;
    p.vx *= 0.985;
    p.vy *= 0.985;
    p.wobble += 0.1;
    p.x += p.vx + Math.sin(p.wobble) * 1.5;
    p.y += p.vy;
    p.rot += p.vrot;
    if (p.y > canvas.height + 60) {
      particles.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    if (p.emoji) {
      ctx.font = `${p.size}px serif`;
      ctx.fillText(p.emoji, -p.size / 2, p.size / 2);
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, (-p.h / 2) * Math.abs(Math.cos(p.wobble)), p.w, p.h * Math.abs(Math.cos(p.wobble)));
    }
    ctx.restore();
  }

  if (particles.length) requestAnimationFrame(animateConfetti);
  else confettiRunning = false;
}

function burstConfetti() {
  const box = $("wheel").getBoundingClientRect();
  const cx = box.left + box.width / 2;
  const cy = box.top + box.height / 2;
  const waves = [
    () => { burst(cx, cy, 300); cannon(0, innerHeight, -Math.PI / 3, 250); cannon(innerWidth, innerHeight, (-2 * Math.PI) / 3, 250); },
    () => { rain(400); burst(cx, cy, 200); },
    () => { cannon(0, innerHeight * 0.6, -Math.PI / 4, 200); cannon(innerWidth, innerHeight * 0.6, (-3 * Math.PI) / 4, 200); },
    () => { rain(500); cannon(innerWidth / 2, innerHeight, -Math.PI / 2, 300); },
    () => { burst(cx, cy, 400); rain(300); },
  ];
  waves.forEach((wave, i) => setTimeout(() => {
    wave();
    if (!confettiRunning) {
      confettiRunning = true;
      requestAnimationFrame(animateConfetti);
    }
  }, i * 450));
  setTimeout(floatLuns, waves.length * 450 + 600);
}

const LUNS_MS = 7000;
let lunsRunning = false;

function floatLuns() {
  if (lunsRunning) return;
  lunsRunning = true;
  const luns = $("luns");
  luns.classList.add("show");
  let x = Math.random() * Math.max(0, innerWidth - luns.offsetWidth);
  let y = Math.random() * Math.max(0, innerHeight - luns.offsetHeight);
  let vx = (Math.random() < 0.5 ? -1 : 1) * 5;
  let vy = (Math.random() < 0.5 ? -1 : 1) * 4;
  const t0 = performance.now();

  function bounce() {
    luns.style.color = CONFETTI_COLORS[randInt(CONFETTI_COLORS.length)];
  }

  function frame(now) {
    const elapsed = now - t0;
    const maxX = innerWidth - luns.offsetWidth;
    const maxY = innerHeight - luns.offsetHeight;
    x += vx;
    y += vy;
    if (x <= Math.min(0, maxX) || x >= Math.max(0, maxX)) { vx = -vx; bounce(); }
    if (y <= Math.min(0, maxY) || y >= Math.max(0, maxY)) { vy = -vy; bounce(); }
    const tilt = Math.sin(elapsed / 300) * 12;
    const scale = 1 + Math.sin(elapsed / 220) * 0.12;
    luns.style.transform = `translate(${x}px, ${y}px) rotate(${tilt}deg) scale(${scale})`;
    if (elapsed > LUNS_MS) luns.classList.remove("show");
    if (elapsed < LUNS_MS + 600) requestAnimationFrame(frame);
    else lunsRunning = false;
  }
  requestAnimationFrame(frame);
}

$("spin").addEventListener("click", spin);
$("wheel").addEventListener("click", spin);
for (const list of Object.values(lists)) list.addEventListener("input", drawWheel);
document.querySelectorAll("[data-mode]").forEach((btn) => btn.addEventListener("click", drawWheel));
drawWheel();

loadWeather().then(drawWheel);
</script>
</body>
</html>
